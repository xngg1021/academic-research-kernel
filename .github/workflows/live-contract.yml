name: Live external contract checks
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-qa.txt
      # The live fences use stdlib HTTP; only the fence reader needs PyYAML.
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Run external API contract checks
        shell: bash
        run: |
          set +e
          python scripts/verify_external_apis.py --output monitoring/external-apis.json
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::External API unavailability, quota or transport failure; not a repository defect."
            exit 0
          fi
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: external-api-status
          path: monitoring/external-apis.json
          if-no-files-found: error
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit QA requirements for known vulnerabilities
        run: pip-audit -r requirements-qa.txt
