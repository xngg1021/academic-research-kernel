name: Live external contract checks
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-qa.txt
      - run: |
          python -m pip install -r requirements-qa.txt
          python -m pip install --no-build-isolation --no-deps .
      - name: Run live Crossref and OpenAlex API contract checks
        shell: bash
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set +e
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from academic_research_kernel import verify_work as vw

          doi = "10.1038/nature14539"
          results = []
          degraded = False
          failed = False
          for name, live_fn, parse_fn in (
              ("crossref", vw.fetch_crossref, vw.parse_crossref_work),
              ("openalex", vw.fetch_openalex, vw.parse_openalex_work),
          ):
              try:
                  raw = live_fn(doi)
                  parsed = parse_fn(raw)
                  if not isinstance(parsed, dict) or parsed.get("doi") != doi:
                      failed = True
                      results.append({"source": name, "status": "failed", "reason": "contract mismatch"})
                  else:
                      results.append({"source": name, "status": "healthy", "year": parsed.get("year")})
              except HTTPError as exc:
                  if exc.code in {401, 403, 408, 425, 429} or exc.code >= 500:
                      degraded = True
                      results.append({"source": name, "status": "degraded", "http_status": exc.code})
                  else:
                      failed = True
                      results.append({"source": name, "status": "failed", "http_status": exc.code})
              except (URLError, TimeoutError, OSError):
                  degraded = True
                  results.append({"source": name, "status": "degraded", "reason": "transport unavailable"})
              except Exception as exc:
                  failed = True
                  results.append({"source": name, "status": "failed", "reason": type(exc).__name__})

          Path("monitoring").mkdir(parents=True, exist_ok=True)
          overall = "failed" if failed else ("degraded" if degraded else "healthy")
          Path("monitoring/external-apis.json").write_text(
              json.dumps({"overall": overall, "checks": results}, indent=2) + "\n",
              encoding="utf-8",
          )
          sys.exit(1 if failed else (2 if degraded else 0))
          PY
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::External API unavailability, quota or transport failure; not a repository defect."
            exit 0
          fi
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: external-api-status
          path: monitoring/external-apis.json
          if-no-files-found: error
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.17'
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit locked dependencies and QA requirements for known vulnerabilities
        run: |
          uv lock --check
          uv export --frozen --extra qa --no-hashes --no-emit-project -o requirements-locked.txt
          pip-audit -r requirements-locked.txt
          pip-audit -r requirements-qa.txt
