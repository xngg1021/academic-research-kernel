name: Skill correctness QA
on:
  push:
    branches: [main, exp/occam-stdlib]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'full-ci')) && !(github.event.action == 'ready_for_review' && contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            python: '3.10'
            full_qa: 'false'
            python_utf8: '1'
          - os: ubuntu-latest
            arch: x86_64
            python: '3.12'
            full_qa: 'true'
            python_utf8: '1'
          - os: ubuntu-latest
            arch: x86_64
            python: '3.14'
            full_qa: 'false'
            python_utf8: '1'
          - os: ubuntu-24.04-arm
            arch: arm64
            python: '3.12'
            full_qa: 'false'
            python_utf8: '1'
          - os: windows-latest
            arch: x86_64
            python: '3.10'
            full_qa: 'false'
            python_utf8: '0'
          - os: windows-11-arm
            arch: arm64
            python: '3.12'
            full_qa: 'false'
            python_utf8: '1'
          - os: macos-latest
            arch: arm64
            python: '3.14'
            full_qa: 'false'
            python_utf8: '1'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: ${{ matrix.python_utf8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-qa.txt
            pyproject.toml
      - run: |
          python -m pip install -r requirements-qa.txt
          python -m pip install --no-build-isolation --no-deps .
      - name: Verify runtime Python version and architecture
        run: |
          python -c "import platform, sys; v=f'{sys.version_info.major}.{sys.version_info.minor}'; m=platform.machine().lower(); assert v == '${{ matrix.python }}', (v, '${{ matrix.python }}'); exp_arm = ('${{ matrix.arch }}' == 'arm64'); assert (('arm' in m or 'aarch64' in m) == exp_arm), (m, '${{ matrix.arch }}')"
      - name: Check committed patch whitespace
        if: matrix.full_qa == 'true'
        shell: bash
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$DIFF_BASE" || "$DIFF_BASE" =~ ^0+$ ]] || ! git cat-file -e "$DIFF_BASE^{commit}" 2>/dev/null; then
            DIFF_BASE="$(git hash-object -w -t tree --stdin </dev/null)"
          fi
          git diff --check "$DIFF_BASE" "$DIFF_HEAD" --
      - name: Run offline doctor diagnostic
        run: academic-research-kernel doctor --json
      - name: Run full pytest suite
        run: python -m pytest -q tests

  distribution-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.17'
      - run: uv lock --check
      - name: Build deterministic wheel and sdist
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          uv build --no-create-gitignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution-candidate
          path: dist/

  distribution-install:
    needs: distribution-build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distribution-candidate
          path: dist/
      - name: Out-of-tree isolated wheel install and CLI/MCP smoke verification
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .isolated-venv
          if [[ -x .isolated-venv/bin/python ]]; then
            VP=".isolated-venv/bin/python"
          else
            VP=".isolated-venv/Scripts/python.exe"
          fi
          "$VP" -m pip install dist/*.whl
          mkdir -p out-of-tree-smoke
          cd out-of-tree-smoke
          "../$VP" -m academic_research_kernel doctor --json > doctor.json
          "../$VP" -c "import json; d=json.load(open('doctor.json', encoding='utf-8')); assert d['status']=='ok' and d['schema_resources']['count']==26 and d['research']['portable_skill']=='available', d"
          "../$VP" -m academic_research_kernel research skill --output ./skill-export
          test -s ./skill-export/SKILL.md
          test -s ./skill-export/references/paper-extraction.schema.json
