[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "academic-research-kernel"
dynamic = ["version"]
description = "Occam stdlib-first academic research state (SQLite STRICT), citation verification, and statistical recomputation over MCP"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "LicenseRef-Source-Lineage-1.0"
license-files = ["LICENSE", "LICENSE-APPLICATION.md", "LICENSE-HISTORY.md", "SOURCE-LINEAGE.md", "LICENSES/MIT-pre-SLL.txt"]
authors = [{name = "Junfu Shi (SJF, xngg1021)"}]
dependencies = ["jsonschema>=4.23,<5", "numpy>=1.26,<3", "scipy>=1.11,<2", "statsmodels>=0.14,<0.16"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
academic-research-kernel = "academic_research_kernel.cli:main"

[project.optional-dependencies]
research = ["pypdf==7.0.0", "fonttools==4.65.0"]
qa = ["pytest>=8,<10", "build>=1.2,<2"]

[tool.hatch.version]
path = "src/academic_research_kernel/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_research_kernel"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/academic_research_kernel",
    "tests",
    "skills",
    "pyproject.toml",
    "plugin.json",
    "mcp.json",
    "README.md",
    "LICENSE",
    "LICENSE-APPLICATION.md",
    "LICENSE-HISTORY.md",
    "SOURCE-LINEAGE.md",
    "LICENSES/MIT-pre-SLL.txt",
]
